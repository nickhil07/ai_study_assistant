<!DOCTYPE html>
<html>
<head>

<title>My Profile</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:#fff;
font-family:'Segoe UI',sans-serif;
min-height:100vh;
}

.container{
max-width:1000px;
}

.main-card{
background:#1e293b;
border:none;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.4);
padding:20px;
}

.profile-img{
width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
border:5px solid #22c55e;
box-shadow:0 0 25px rgba(34,197,94,.4);
}

.info-box{
background:#111827;
padding:15px;
border-radius:15px;
margin-bottom:12px;
border-left:4px solid #3b82f6;
font-size:16px;
}

.history-item{
background:#111827;
padding:15px;
border-radius:15px;
margin-bottom:12px;
border-left:4px solid #22c55e;
transition:.3s;
}

.history-item:hover{
transform:translateX(5px);
}

.dashboard-name{
font-size:32px;
font-weight:700;
color:white;
}

.dashboard-subtitle{
color:#cbd5e1;
font-size:18px;
}

.btn{
border-radius:12px;
font-weight:600;
padding:10px 18px;
}

.section-title{
font-size:28px;
font-weight:700;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="container py-5">

<div class="card main-card p-4">

<div class="text-center">

<img
src="{{ url_for('static', filename='uploads/' + user[5]) }}"
class="profile-img">

<h2 class="mt-3 dashboard-name">
{{ user[1] }}
</h2>

<p class="dashboard-subtitle">
Student Dashboard
</p>

</div>

<hr>

<div class="info-box">
<strong>Email:</strong> {{ user[2] }}
</div>

<div class="info-box">
<strong>Mobile:</strong> {{ user[3] }}
</div>

<div class="info-box">
<strong>Designation:</strong> {{ user[4] }}
</div>

<div class="mt-4 d-flex flex-wrap justify-content-center gap-3">

<a href="/" class="btn btn-success">
Open AI Assistant
</a>

<a href="/forgot-password" class="btn btn-warning">
Change Password
</a>

<a href="/logout" class="btn btn-danger">
Logout
</a>

</div>

<hr>

<h3 class="section-title">
📚 Study History
</h3>

{% if history %}

{% for item in history %}

<div class="history-item">
{{ item[0] }}
</div>

{% endfor %}

{% else %}

<div class="alert alert-secondary">
No study history available.
</div>

{% endif %}

</div>

</div>

</body>
</html>
