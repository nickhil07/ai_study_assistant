<!DOCTYPE html>
<html>
<head>

<title>My Profile</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#0f172a;
color:white;
font-family:Segoe UI;
}

.main-card{
background:#1e293b;
border:none;
border-radius:25px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

.profile-img{
width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
border:5px solid #22c55e;
}

.info-box{
background:#0f172a;
padding:12px;
border-radius:12px;
margin-bottom:10px;
}

.history-item{
background:#0f172a;
padding:12px;
border-radius:12px;
margin-bottom:10px;
border-left:4px solid #22c55e;
}

</style>

</head>

<body>

<div class="container py-5">

<div class="card main-card p-4">

<div class="text-center">

<img
src="{{ url_for('static', filename='uploads/' + user[5]) }}"
class="profile-img">

<h2 class="mt-3">
{{ user[1] }}
</h2>

<p class="text-secondary">
Student Dashboard
</p>

</div>

<hr>

<div class="info-box">
<strong>Email:</strong> {{ user[2] }}
</div>

<div class="info-box">
<strong>Mobile:</strong> {{ user[3] }}
</div>

<div class="info-box">
<strong>Designation:</strong> {{ user[4] }}
</div>

<div class="mt-3 d-flex flex-wrap gap-2">

<a href="/" class="btn btn-success">
Open AI Assistant
</a>

<a href="/forgot-password" class="btn btn-warning">
Change Password
</a>

<a href="/logout" class="btn btn-danger">
Logout
</a>

</div>

<hr>

<h4 class="mb-3">
📚 Study History
</h4>

{% if history %}

{% for item in history %}

<div class="history-item">
{{ item[0] }}
</div>

{% endfor %}

{% else %}

<div class="alert alert-secondary">
No study history available.
</div>

{% endif %}

</div>

</div>

</body>
</html>
