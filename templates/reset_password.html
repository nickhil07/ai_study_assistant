<!DOCTYPE html>
<html>
<head>

<title>Reset Password</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:450px;
background:#1e293b;
color:white;
border:none;
border-radius:20px;
padding:30px;
}

</style>

</head>

<body>

<div class="card">

<h2 class="text-center mb-4">
🔒 Reset Password
</h2>

<form method="POST">

<label>New Password</label>

<input
type="password"
name="password"
class="form-control mb-3"
required>

<button
class="btn btn-success w-100">

Update Password

</button>

</form>

</div>

</body>
</html>
