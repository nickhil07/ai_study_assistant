<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0f172a;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:450px;
            padding:30px;
            border-radius:20px;
            background:#1e293b;
            color:white;
            box-shadow:0 0 20px rgba(0,0,0,.3);
        }

        .form-control{
            background:#334155;
            border:none;
            color:white;
        }

        .form-control:focus{
            background:#334155;
            color:white;
            box-shadow:none;
        }

    </style>

</head>

<body>

<div class="card">

    <h2 class="text-center mb-4">
        🤖 AI Study Assistant
    </h2>

    <form method="POST">

        <div class="mb-3">

            <label>Email</label>

            <input
                type="email"
                name="email"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label>Password</label>

            <input
                type="password"
                name="password"
                class="form-control"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-success w-100">

            Login

        </button>

        <a
            href="/forgot-password"
            class="btn btn-warning w-100 mt-2">

            Forgot Password

        </a>

        <a
            href="/register"
            class="btn btn-outline-light w-100 mt-2">

            Create Account

        </a>

    </form>

</div>

</body>
</html>
